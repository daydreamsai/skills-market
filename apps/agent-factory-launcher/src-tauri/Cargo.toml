[package]
name = "agent-factory-launcher"
version = "0.1.0"
description = "Simple macOS launcher for Lucid agent-factory batches"
authors = ["Daydreams AI"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
